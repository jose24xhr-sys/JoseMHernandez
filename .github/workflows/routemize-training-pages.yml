name: Deploy Routemize training to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/routemize-training/**"
      - ".github/workflows/routemize-training-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Routemize training site
        shell: bash
        run: |
          mkdir -p _site/routemize-training
          cp public/routemize-training/index.html _site/index.html
          cp public/routemize-training/index.html _site/routemize-training/index.html
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
